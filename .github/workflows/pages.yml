name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. Tests der Impf- und Reiseregeln
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # 2. App-Dateien zusammenpacken und hochladen
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nur App-Dateien veröffentlichen
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 3. Veröffentlichen – als eigener Job, damit der Upload sicher abgeschlossen ist.
  #    Falls GitHub das Paket trotzdem noch nicht findet: nach 20 s ein zweiter Versuch.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
